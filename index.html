<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F7F4EE">
<title>Ensemble</title>
<meta name="description" content="Love their style. Make it yours. Build a wardrobe inspired by the characters you love, at your budget.">

<style>
  :root {
    --ground: #F7F4EE;
    --paper: #FFFFFF;
    --ink: #1A1A1A;
    --ink-soft: #5B5955;
    --ink-faint: #8C8A85;
    --line: #E4E0D8;
    --accent: #8A5A3C;
    --accent-soft: #EFE4DA;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable", "Segoe UI", Roboto, sans-serif;
    --radius: 14px;
    --edge: clamp(20px, 5vw, 56px);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font);
    line-height: 1.6;
    font-size: 17px;
    -webkit-font-smoothing: antialiased;
  }

  body { min-height: 100vh; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* ---- shared grid: nav and content share one left/right edge ---- */
  .nav-inner, .wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 0 var(--edge);
  }

  .nav {
    padding-top: 22px;
    padding-bottom: 22px;
    border-bottom: 1px solid var(--line);
  }
  .nav-inner { display: flex; justify-content: space-between; align-items: center; }
  .wordmark { font-size: 16px; font-weight: 600; letter-spacing: 0.01em; color: var(--ink); text-decoration: none; }
  .nav-tag { font-size: 13px; color: var(--ink-faint); }

  /* ---- Landing ---- */
  .landing { padding: clamp(56px, 9vw, 96px) 0 clamp(48px, 7vw, 72px); }
  .landing h1 {
    font-size: clamp(30px, 5vw, 42px);
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.2;
    max-width: 16ch;
    margin-bottom: 14px;
  }
  .landing .sub { color: var(--ink-soft); font-size: 17px; max-width: 48ch; margin-bottom: 40px; }

  .char-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
  }
  .char-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 24px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    transition: border-color 0.15s ease;
    display: flex;
    flex-direction: column;
  }
  .char-card:hover { border-color: var(--accent); }
  .char-card .show {
    font-size: 12px; font-weight: 500; letter-spacing: 0.03em; text-transform: uppercase;
    color: var(--ink-faint);
    min-height: 32px;
    display: flex;
    align-items: flex-start;
    margin-bottom: 4px;
  }
  .char-card .name { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
  .char-card .desc { font-size: 14px; color: var(--ink-soft); line-height: 1.5; }

  /* ---- Wardrobe view ---- */
  .wardrobe-view { display: none; padding: clamp(32px, 5vw, 56px) 0 clamp(64px, 8vw, 96px); }
  .wardrobe-view.active { display: block; }

  .back-link {
    display: inline-block;
    font-size: 13px;
    color: var(--ink-faint);
    text-decoration: none;
    margin-bottom: 28px;
    background: none;
    border: none;
    font-family: inherit;
    cursor: pointer;
    padding: 0;
  }
  .back-link:hover { color: var(--ink); }

  .wardrobe-head { margin-bottom: 28px; }
  .wardrobe-head .eyebrow { font-size: 13px; color: var(--ink-faint); margin-bottom: 8px; }
  .wardrobe-head h2 { font-size: clamp(26px, 4vw, 32px); font-weight: 600; margin-bottom: 10px; }
  .wardrobe-head .recipe { color: var(--ink-soft); font-size: 16px; max-width: 56ch; }

  /* ---- Budget slider ---- */
  .budget-block { margin: 32px 0 8px; max-width: 420px; }
  .budget-label-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-faint); margin-bottom: 10px; }
  .budget-label-row .current { color: var(--ink); font-weight: 600; }

  .slider-track {
    position: relative;
    height: 36px;
    display: flex;
    align-items: center;
  }
  .slider-rail {
    position: absolute;
    left: 0; right: 0; top: 50%;
    height: 3px;
    background: var(--line);
    transform: translateY(-50%);
    border-radius: 2px;
  }
  .slider-stop {
    position: absolute;
    top: 50%;
    width: 8px; height: 8px;
    background: var(--line);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  input[type="range"].budget-range {
    position: relative;
    z-index: 2;
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    cursor: pointer;
    margin: 0;
  }
  input[type="range"].budget-range::-webkit-slider-runnable-track { background: transparent; height: 36px; }
  input[type="range"].budget-range::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--ink);
    border: 3px solid var(--paper);
    box-shadow: 0 0 0 1px var(--ink);
    margin-top: 7px;
    cursor: grab;
  }
  input[type="range"].budget-range::-webkit-slider-thumb:active { cursor: grabbing; }
  input[type="range"].budget-range::-moz-range-track { background: transparent; height: 36px; }
  input[type="range"].budget-range::-moz-range-thumb {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--ink);
    border: 3px solid var(--paper);
    box-shadow: 0 0 0 1px var(--ink);
    cursor: grab;
  }

  .budget-ticks { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-faint); margin-top: 6px; }

  .result-line { font-size: 15px; color: var(--ink); font-weight: 600; margin: 24px 0 24px; }

  /* ---- Fixed board: same shape at every budget ---- */
  .board {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
    margin-bottom: 32px;
  }
  @media (max-width: 720px) {
    .board { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 420px) {
    .board { grid-template-columns: repeat(2, 1fr); }
  }

  .piece-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    transition: border-color 0.15s ease;
  }
  .piece-card:hover { border-color: var(--accent); }
  .piece-card.empty {
    border-style: dashed;
    background: transparent;
  }
  .piece-card.empty:hover { border-color: var(--line); }

  .piece-swatch {
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .piece-swatch svg { width: 44%; height: 44%; opacity: 0.35; }

  .piece-body { padding: 12px 14px 14px; flex: 1; display: flex; flex-direction: column; }
  .piece-name { font-size: 13px; font-weight: 500; color: var(--ink); margin-bottom: 3px; line-height: 1.4; }
  .piece-price { font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
  .piece-reason { font-size: 12px; color: var(--ink-faint); line-height: 1.45; margin-bottom: 8px; flex: 1; }
  .piece-retailer {
    font-size: 12px; font-weight: 500; color: var(--accent);
    margin-top: auto;
  }

  /* ---- Feedback ---- */
  .feedback-row {
    border-top: 1px solid var(--line);
    padding: 24px 0;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .feedback-q { font-size: 14px; color: var(--ink-soft); }
  .feedback-buttons { display: flex; gap: 8px; }
  .feedback-btn {
    font-family: inherit;
    font-size: 16px;
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-faint);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .feedback-btn:hover { border-color: var(--accent); color: var(--accent); }
  .feedback-btn.selected { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .save-row { padding-top: 4px; }
  .save-link {
    font-size: 13px;
    color: var(--ink-faint);
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .save-link:hover { color: var(--ink-soft); }

  footer {
    border-top: 1px solid var(--line);
    padding: 28px var(--edge);
    text-align: center;
    font-size: 13px;
    color: var(--ink-faint);
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="#" class="wordmark" id="homeLink">Ensemble</a>
    <span class="nav-tag">Love their style. Make it yours.</span>
  </div>
</nav>

<div class="wrap">

  <section class="landing" id="landing">
    <h1>Whose style do you keep noticing?</h1>
    <p class="sub">Build a wardrobe inspired by the characters you love, at your budget.</p>

    <div class="char-grid" id="charGrid"></div>
  </section>

  <section class="wardrobe-view" id="wardrobeView">
    <button class="back-link" id="backLink">Back</button>

    <div class="wardrobe-head">
      <div class="eyebrow" id="wShow"></div>
      <h2 id="wName"></h2>
      <p class="recipe" id="wRecipe"></p>
    </div>

    <div class="budget-block">
      <div class="budget-label-row">
        <span>Budget</span>
        <span class="current" id="budgetCurrent"></span>
      </div>
      <div class="slider-track">
        <div class="slider-rail"></div>
        <div class="slider-stop" style="left:0%"></div>
        <div class="slider-stop" style="left:50%"></div>
        <div class="slider-stop" style="left:100%"></div>
        <input type="range" class="budget-range" id="budgetRange" min="0" max="2" step="1" value="1">
      </div>
      <div class="budget-ticks"><span>$150</span><span>$250</span><span>$500</span></div>
    </div>

    <p class="result-line" id="resultLine"></p>

    <div class="board" id="board"></div>

    <div class="feedback-row">
      <span class="feedback-q" id="feedbackQ"></span>
      <div class="feedback-buttons">
        <button class="feedback-btn" id="thumbUp" aria-label="Yes, this feels right">&#128077;</button>
        <button class="feedback-btn" id="thumbDown" aria-label="Not quite">&#128078;</button>
      </div>
    </div>

    <div class="save-row">
      <a href="#" class="save-link">Save this wardrobe</a>
    </div>
  </section>

</div>

<footer>Ensemble is a proof of concept. Mock data shown for layout and tone only.</footer>

<script>
  const SLOTS = 5;
  const BUDGETS = [150, 250, 500];

  // Simple neutral placeholder icons by rough category, no brand, no repeated text.
  const ICONS = {
    top: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 3 4 6v3h3v12h10V9h3V6l-4-3-3 2-3-2z"/></svg>',
    bottom: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 3h12l1 7-2 11h-4l-1-9-1 9H7L5 10z"/></svg>',
    shoe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 18c0-3 2-4 5-6l4-3 3 2c3 1 6 2 6 5v2H3z"/></svg>',
    outer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M7 3 3 6v3h3v12h12V9h3V6l-4-3-3 2v4l-3-2-3 2V5z"/></svg>',
    accessory: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="8"/></svg>'
  };

  const DATA = {
    carmy: {
      show: "The Bear",
      name: "Carmy",
      recipe: "Workwear basics, a neutral palette, relaxed fits.",
      tiers: {
        150: { items: [
          { icon:"top", name:"White heavyweight tee", price:28, reason:"Heavyweight cotton instead of a thin logo tee.", retailer:"Uniqlo" },
          { icon:"bottom", name:"Straight-leg work trouser", price:45, reason:"Loose through the leg, the relaxed line that reads as his.", retailer:"Dickies" },
          { icon:"shoe", name:"Canvas work boot", price:62, reason:"Plain toe, worn neutral, no branding.", retailer:"Red Wing" },
          { icon:"accessory", name:"Canvas work belt", price:15, reason:"Flat and plain, not a logo buckle.", retailer:"Carhartt" }
        ]},
        250: { items: [
          { icon:"top", name:"White heavyweight tee", price:28, reason:"The base layer under everything he wears.", retailer:"Uniqlo" },
          { icon:"outer", name:"Cropped work jacket", price:68, reason:"Cropped length keeps it from looking like outerwear.", retailer:"Carhartt" },
          { icon:"bottom", name:"Straight-leg trousers", price:55, reason:"The same relaxed line, a step up in fabric.", retailer:"Dickies" },
          { icon:"shoe", name:"Leather work shoes", price:89, reason:"Leather instead of canvas, still no branding.", retailer:"Red Wing" }
        ]},
        500: { items: [
          { icon:"top", name:"White heavyweight tee (2-pack)", price:42, reason:"Two of the same base layer, nothing changes about it.", retailer:"Uniqlo" },
          { icon:"outer", name:"Waxed canvas chore coat", price:165, reason:"Heavier and warmer, same cropped silhouette.", retailer:"Carhartt" },
          { icon:"bottom", name:"Heavyweight wool-blend trouser", price:80, reason:"Warmer fabric, the same straight line holds.", retailer:"Dickies" },
          { icon:"shoe", name:"Full-grain leather boot", price:178, reason:"Built to last, still a plain toe.", retailer:"Red Wing" },
          { icon:"accessory", name:"Ribbed knit beanie", price:32, reason:"Plain and neutral, nothing seasonal about it.", retailer:"Carhartt" }
        ]}
      }
    },
    draper: {
      show: "Mad Men",
      name: "Don Draper",
      recipe: "Tailored suiting, a charcoal and navy palette, narrow lapels.",
      tiers: {
        150: { items: [
          { icon:"top", name:"Crisp white dress shirt", price:42, reason:"Pressed and plain, the one piece that never changes.", retailer:"Brooks Brothers" },
          { icon:"accessory", name:"Narrow silk tie", price:28, reason:"Solid color, no pattern to date it.", retailer:"Todd Snyder" },
          { icon:"bottom", name:"Charcoal wool-blend trouser", price:45, reason:"Flat front, the quiet half of the silhouette.", retailer:"Brooks Brothers" },
          { icon:"shoe", name:"Leather derby shoe", price:35, reason:"Plain and formal instead of casual.", retailer:"Johnston & Murphy" }
        ]},
        250: { items: [
          { icon:"top", name:"Cotton poplin dress shirt", price:52, reason:"A finer weave, still plain white.", retailer:"Brooks Brothers" },
          { icon:"accessory", name:"Narrow silk tie, solid navy", price:35, reason:"Same narrow width, a richer fabric.", retailer:"Todd Snyder" },
          { icon:"bottom", name:"Charcoal wool trouser, pleated", price:68, reason:"A heavier wool, the same charcoal.", retailer:"Brooks Brothers" },
          { icon:"shoe", name:"Polished oxford shoe", price:90, reason:"The formal shoe the rest of the look expects.", retailer:"Johnston & Murphy" }
        ]},
        500: { items: [
          { icon:"outer", name:"Charcoal two-button suit jacket", price:220, reason:"The single well-cut piece the whole look is built on.", retailer:"Brooks Brothers" },
          { icon:"bottom", name:"Charcoal wool trouser, suit-matched", price:85, reason:"Cut to match the jacket, not sold alone.", retailer:"Brooks Brothers" },
          { icon:"top", name:"Cotton dress shirt, fitted", price:58, reason:"A closer cut under a structured jacket.", retailer:"Brooks Brothers" },
          { icon:"accessory", name:"Silk twill tie", price:45, reason:"A heavier silk for a heavier jacket.", retailer:"Todd Snyder" },
          { icon:"shoe", name:"Oxford shoe, leather sole", price:90, reason:"A full leather sole for a formal suit.", retailer:"Johnston & Murphy" }
        ]}
      }
    },
    carlton: {
      show: "The Fresh Prince of Bel-Air",
      name: "Carlton Banks",
      recipe: "Preppy layering, bold color, collegiate details.",
      tiers: {
        150: { items: [
          { icon:"top", name:"Collared oxford shirt", price:35, reason:"The base layer under the vest, never worn alone.", retailer:"J.Crew" },
          { icon:"outer", name:"Argyle sweater vest, lightweight", price:38, reason:"The layering piece that makes the look his.", retailer:"Ralph Lauren" },
          { icon:"bottom", name:"Pleated chino trouser", price:45, reason:"Collegiate, not casual, the pleat matters.", retailer:"J.Crew" },
          { icon:"shoe", name:"Penny loafer, basic", price:32, reason:"No sneaker ever enters this outfit.", retailer:"Sperry" }
        ]},
        250: { items: [
          { icon:"top", name:"Striped collared shirt", price:42, reason:"A bolder stripe under the same vest shape.", retailer:"J.Crew" },
          { icon:"outer", name:"Argyle sweater vest, wool-blend", price:58, reason:"A richer knit, the same layering idea.", retailer:"Ralph Lauren" },
          { icon:"bottom", name:"Pleated chino trouser", price:58, reason:"The same collegiate cut, better fabric.", retailer:"J.Crew" },
          { icon:"shoe", name:"Penny loafer, leather", price:85, reason:"Leather instead of synthetic, still a loafer.", retailer:"Sperry" }
        ]},
        500: { items: [
          { icon:"outer", name:"Varsity-stripe blazer", price:185, reason:"The boldest piece, worn open over the vest.", retailer:"Ralph Lauren" },
          { icon:"outer", name:"Argyle sweater vest, cashmere-blend", price:72, reason:"Still layered under the blazer, never alone.", retailer:"Ralph Lauren" },
          { icon:"top", name:"Striped collared shirt, fitted", price:55, reason:"A closer cut to sit under two layers.", retailer:"J.Crew" },
          { icon:"bottom", name:"Pleated wool trouser", price:70, reason:"A dressier fabric for the dressier jacket.", retailer:"J.Crew" },
          { icon:"shoe", name:"Penny loafer, full-grain leather", price:110, reason:"The same loafer shape, built to last.", retailer:"Sperry" }
        ]}
      }
    }
  };

  const charGrid = document.getElementById("charGrid");
  const landing = document.getElementById("landing");
  const wardrobeView = document.getElementById("wardrobeView");
  const backLink = document.getElementById("backLink");
  const homeLink = document.getElementById("homeLink");
  const budgetRange = document.getElementById("budgetRange");
  const budgetCurrent = document.getElementById("budgetCurrent");
  const board = document.getElementById("board");
  const resultLine = document.getElementById("resultLine");
  const feedbackQ = document.getElementById("feedbackQ");
  const thumbUp = document.getElementById("thumbUp");
  const thumbDown = document.getElementById("thumbDown");

  let currentChar = null;

  Object.entries(DATA).forEach(([key, c]) => {
    const card = document.createElement("button");
    card.className = "char-card";
    card.innerHTML = `
      <div class="show">${c.show}</div>
      <div class="name">${c.name}</div>
      <div class="desc">${c.recipe}</div>
    `;
    card.addEventListener("click", () => openWardrobe(key));
    charGrid.appendChild(card);
  });

  budgetRange.addEventListener("input", render);

  function openWardrobe(key) {
    currentChar = key;
    budgetRange.value = 1;
    landing.style.display = "none";
    wardrobeView.classList.add("active");
    thumbUp.classList.remove("selected");
    thumbDown.classList.remove("selected");
    render();
    window.scrollTo(0, 0);
  }

  function closeWardrobe() {
    wardrobeView.classList.remove("active");
    landing.style.display = "block";
    currentChar = null;
  }

  backLink.addEventListener("click", closeWardrobe);
  homeLink.addEventListener("click", (e) => { e.preventDefault(); closeWardrobe(); });

  thumbUp.addEventListener("click", () => {
    thumbUp.classList.add("selected");
    thumbDown.classList.remove("selected");
  });
  thumbDown.addEventListener("click", () => {
    thumbDown.classList.add("selected");
    thumbUp.classList.remove("selected");
  });

  function render() {
    if (!currentChar) return;
    const c = DATA[currentChar];
    const budget = BUDGETS[Number(budgetRange.value)];
    const tierData = c.tiers[budget];

    document.getElementById("wShow").textContent = c.show;
    document.getElementById("wName").textContent = "Inspired by " + c.name;
    document.getElementById("wRecipe").textContent = c.recipe;
    budgetCurrent.textContent = "$" + budget;
    feedbackQ.textContent = "Does this feel like " + c.name + "?";

    const total = tierData.items.reduce((sum, i) => sum + i.price, 0);
    resultLine.textContent = tierData.items.length + " pieces that work together. $" + total + ".";

    board.innerHTML = "";
    for (let i = 0; i < SLOTS; i++) {
      const item = tierData.items[i];
      const card = document.createElement(item ? "a" : "div");
      if (item) {
        card.className = "piece-card";
        card.href = "#";
        card.addEventListener("click", (e) => e.preventDefault());
        card.innerHTML = `
          <div class="piece-swatch">${ICONS[item.icon] || ICONS.accessory}</div>
          <div class="piece-body">
            <div class="piece-name">${item.name}</div>
            <div class="piece-price">$${item.price}</div>
            <div class="piece-reason">${item.reason}</div>
            <div class="piece-retailer">View at ${item.retailer} &rarr;</div>
          </div>
        `;
      } else {
        card.className = "piece-card empty";
      }
      board.appendChild(card);
    }
  }
</script>

</body>
</html>
